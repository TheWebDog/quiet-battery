[package]
name = "quiet-battery"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Native Windows peripheral battery monitor with extensible protocol adapters"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["TheWebDog"]
repository = "https://github.com/TheWebDog/quiet-battery"

[dependencies]
windows-future = "=0.2.1"
windows-collections = "=0.2.0"
windows = { version = "=0.61.3", features = ["Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_WinRT"] }
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Time", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Accessibility", "Win32_Security", "Win32_System_Com", "Win32_System_SystemServices", "Win32_System_StationsAndDesktops", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_HumanInterfaceDevice"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
